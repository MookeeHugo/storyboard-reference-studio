name: Windows Release Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail the release if Windows code signing is not configured.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-release-gate:
    name: prepare ffmpeg, build, and smoke Tauri release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing && '1' || '0' }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME || 'BloomReel Team' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare ffmpeg and ffprobe sidecars
        run: npm run prepare:ffmpeg

      - name: Build frontend
        run: npm run build

      - name: Check Tauri commands
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri release
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_PUBLISHER_NAME: ${{ env.WINDOWS_PUBLISHER_NAME }}
          WINDOWS_SIGNING_REQUIRED: ${{ env.WINDOWS_SIGNING_REQUIRED }}
        run: npm run tauri:build

      - name: Sign Windows installers
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_PUBLISHER_NAME: ${{ env.WINDOWS_PUBLISHER_NAME }}
          WINDOWS_SIGNING_REQUIRED: ${{ env.WINDOWS_SIGNING_REQUIRED }}
        run: npm run sign:windows

      - name: Smoke browser Chinese demo
        run: npm run smoke

      - name: Smoke Tauri release exports
        run: npm run smoke:tauri

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload smoke export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-export-evidence
          path: |
            output/tauri-release-smoke
            output/pdf
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundles
          path: |
            src-tauri/target/release/storyboard-reference-studio.exe
            src-tauri/target/release/bundle
            output/signing/windows-signing-manifest.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Create draft GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: storyboard-reference-studio-${{ github.run_number }}
          name: Storyboard Reference Studio Windows ${{ github.run_number }}
          body: |
            Windows release draft generated by CI.

            Validation gate:
            - npm run prepare:ffmpeg
            - npm run build
            - cargo check --manifest-path src-tauri/Cargo.toml
            - npm run tauri:build
            - npm run sign:windows
            - npm run smoke
            - npm run smoke:tauri

            Signing:
            - WINDOWS_SIGNING_REQUIRED=${{ env.WINDOWS_SIGNING_REQUIRED }}
            - See output/signing/windows-signing-manifest.json for SHA256 hashes, signature status, timestamp URL, and SmartScreen publishing notes.

            SmartScreen note: use a stable OV/EV publisher certificate, keep timestamping enabled, and distribute signed installers from this release channel consistently to build Microsoft reputation.
          files: |
            src-tauri/target/release/storyboard-reference-studio.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            output/signing/windows-signing-manifest.json
